<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>

    <div class="choises">
        <div class="choise" id="rock">
            <img src="assets/rock.png" alt="rock icon">
        </div>
        <div class="choise" id="paper">
            <img src="assets/paper.png" alt="paper icon">
        </div>
        <div class="choise" id="scissors">
            <img src="assets/scissors.png" alt="scissors icon">
        </div>
    </div>


    <div class="score-board">
        <div class="score-container">
            <p id="user_score">0</p>
            <p>You</p>
        </div>
        <div class="score-container">
            <p id="comp_score">0</p>
            <p>Computer</p>
        </div>
    </div>

    <div class="msg-container">
        <h2 id="msg">Play your move</h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
